# nginx config: serves the React build and proxies /api to the backend.
# Same origin for the app and the API, so the browser needs no CORS.
server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # /api/runs -> http://backend:8000/runs
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    # Server-Sent Events: pass every event through immediately, and keep
    # long-running streams (a run can take minutes) open
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    client_max_body_size 1m;   # standards uploads are capped at 100k characters
  }

  # Vite puts a content hash in asset file names, so they can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Any other URL serves index.html (single-page app); never cache it
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
